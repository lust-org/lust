name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every entry runs `./dev.py test`: every library against the stock
# `luajit` of the distribution (shared) and inside `lust` (static), plus
# the lazy loading, docs, startup and bytecode checks. `perf` is
# deliberately not installed: the bench/baseline.txt instruction counts
# are recorded on a developer machine and depend on its toolchain, so
# test_bench.py only runs the benchmarks (checking their results) and
# skips the comparison.
jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Empty: the job runs directly on the runner.
    container: ${{ matrix.container }}
    strategy:
      # One distribution failing says nothing about the other.
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (glibc, dynamic)
            container: ''
            install: >-
              sudo apt-get update &&
              sudo apt-get install -y --no-install-recommends
              build-essential meson ninja-build python3 luajit git binutils
          - name: Alpine (musl, dynamic)
            container: alpine:latest
            install: >-
              apk add --no-cache
              build-base meson ninja python3 luajit git binutils
    steps:
      # Before the checkout: without git, actions/checkout downloads a
      # tarball without history (see fetch-depth below).
      - name: Install dependencies
        run: ${{ matrix.install }}

      - uses: actions/checkout@v7
        with:
          # The LuaJIT version stamp is the time of the last commit
          # touching vendor/luajit (tools/build-luajit.py): needs history.
          fetch-depth: 0

      - name: Build
        run: ./dev.py build

      - name: Test
        run: ./dev.py test --print-errorlogs
