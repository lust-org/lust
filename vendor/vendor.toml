[luajit]
repo_url = "https://github.com/LuaJIT/LuaJIT.git"
rev = "v2.1"

[xxhash]
repo_url = "https://github.com/Cyan4973/xxHash.git"
rev = "v0.8.4"
exclude = ["tests"]

[pcre2]
repo_url = "https://github.com/PCRE2Project/pcre2.git"
rev = "pcre2-10.49"
exclude = ["maint", "doc", "testdata"]

[yyjson]
repo_url = "https://github.com/ibireme/yyjson.git"
rev = "0.13.0"
exclude = ["doc", "test"]

[mbedtls]
repo_url = "https://github.com/Mbed-TLS/mbedtls.git"
rev = "v4.2.0"
exclude = ["tests", "programs"]

[curl]
repo_url = "https://github.com/curl/curl.git"
rev = "curl-8_23_0"
exclude = ["docs", "tests", "projects", "src"]
